name: 检查与构建

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows 行为测试与构建
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: 检出源码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 安装 Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: 安装锁定版本依赖
        run: npm ci
      - name: 验证行为
        run: npm test
      - name: 验证应用构建
        run: npm run build
      - name: 构建安装包
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run package
      - name: 验证安装、快捷方式、安装版运行及卸载
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run test:installer
      - name: 生成安装包校验文件
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $name = "Hextech-Agent-Setup-$version-x64.exe"
          $hash = (Get-FileHash -LiteralPath "release/$name" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Set-Content -LiteralPath release/SHA256SUMS.txt -Encoding ascii
      - name: 保存验证后的安装包
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-installer
          compression-level: 0
          if-no-files-found: error
          path: |
            release/Hextech-Agent-Setup-*-x64.exe
            release/SHA256SUMS.txt

  release:
    name: 发布安装包
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出发布说明
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 下载已验证安装包
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-installer
          path: release
      - name: 发布 GitHub 版本
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(node -p 'require("./package.json").version')
          test "$GITHUB_REF_NAME" = "v$version"
          gh release create "$GITHUB_REF_NAME" "release/Hextech-Agent-Setup-$version-x64.exe" release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease \
            --title "海克斯 Agent $GITHUB_REF_NAME 安装版" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md"
